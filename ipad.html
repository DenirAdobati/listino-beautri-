<style>
  /* Menu iPad di Beautrì: tela fissa 1180×820 (iPad in orizzontale), scalata per riempire lo schermo */
  :root {
    --nero: #0A0A0A; --nero-2: #151515; --nero-3: #1E1E1E; --giallo: #F5C200; --giallo-scuro: #7A5D00; --rosso: #D62F32; --verde: #17834A; --sabbia: #F6F4EF; --crema: #FFFBEA;
    --testo: #2E2E2E; --testo-2: #4A4A4A;
    --logo: url('https://beautri.it/cdn/shop/t/2/assets/beautri-logo.png?v=120188509770860192361789545147');
    --daniela: url('https://beautri.it/cdn/shop/t/2/assets/beautri-chisiamo-team-daniela.webp?v=64710030799597955211789648498');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--nero); overflow: hidden; }
  body { font-family: Inter, -apple-system, sans-serif; color: var(--nero); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  #app { position: absolute; left: 50%; top: 50%; width: 1180px; height: 820px; overflow: hidden; display: flex; transform-origin: center; background: #fff; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 99; background: var(--nero); color: #fff; align-items: center; justify-content: center; flex-direction: column; gap: 18px; text-align: center; padding: 30px; font-family: Poppins, sans-serif; font-weight: 800; font-size: 22px; }
  #rotate i { font-size: 54px; color: var(--giallo); }
  @media (orientation: portrait) and (max-width: 1000px) { #rotate { display: flex; } }

  /* sfondi a quadretti del sito */
  .bg-dark { background-color: var(--nero); background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 44px 44px; color: #fff; }
  .bg-white { background-color: #fff; background-image: linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px); background-size: 44px 44px; }
  .scr { position: absolute; inset: 0; display: flex; animation: fade .25s ease-out both; }
  @keyframes fade { from { opacity: .4; } to { opacity: 1; } }

  /* ---------- barra in alto ---------- */
  .nav { position: absolute; left: 18px; right: 18px; top: 14px; height: 70px; border-radius: 18px; background: rgba(10,10,10,.94); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 30px rgba(0,0,0,.25); display: flex; align-items: center; gap: 14px; padding: 0 10px 0 20px; color: #fff; z-index: 20; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: .03em; white-space: nowrap; }
  .logo i { width: 26px; height: 26px; background: var(--logo) center/contain no-repeat; }
  .tabs { display: flex; gap: 4px; margin: 0 auto; }
  .tab { min-height: 52px; padding: 0 18px; border-radius: 12px; display: flex; align-items: center; gap: 9px; font-family: Poppins, sans-serif; font-weight: 700; font-size: 16px; color: rgba(255,255,255,.82); }
  .tab i { font-size: 15px; color: rgba(255,255,255,.6); }
  .tab.on { background: var(--giallo); color: var(--nero); box-shadow: 0 0 18px rgba(245,194,0,.3); }
  .tab.on i { color: var(--nero); }
  .seg { display: flex; align-items: center; gap: 8px; }
  .seg small { font-family: Caveat, cursive; font-weight: 700; font-size: 20px; color: var(--giallo); }
  .seg div { display: flex; background: rgba(255,255,255,.1); border-radius: 12px; padding: 4px; }
  .seg button { min-height: 46px; min-width: 60px; padding: 0 12px; border-radius: 9px; font-family: Poppins, sans-serif; font-weight: 800; font-size: 15px; color: rgba(255,255,255,.82); text-align: center; }
  .seg button.on { background: #fff; color: var(--nero); }

  /* ---------- elementi comuni ---------- */
  .eyebrow { font-family: Poppins, sans-serif; font-weight: 700; font-size: 15px; color: var(--giallo); letter-spacing: .02em; }
  .eyebrow::before, .eyebrow::after { content: "•"; margin: 0 9px; }
  .eyebrow::before { margin-left: 0; }
  .eyebrow.ink { color: var(--nero); }
  .eyebrow.ink::before, .eyebrow.ink::after { color: var(--giallo-scuro); }
  .h1 { font-family: Poppins, sans-serif; font-weight: 900; letter-spacing: -0.045em; line-height: 1.04; color: #fff; }
  .h1 .y, .y { color: var(--giallo); }
  .h1 .sub { display: block; font-size: 30px; letter-spacing: -0.03em; color: #fff; margin-top: 4px; }
  .hl { background: linear-gradient(transparent 60%, rgba(245,194,0,.7) 60%); padding: 0 3px; }
  .lead { font-size: 17px; line-height: 1.55; letter-spacing: .03em; color: rgba(255,255,255,.88); }
  .lead b { color: #fff; }
  .hand { font-family: Caveat, cursive; font-weight: 700; }
  .arrow-sq { width: 48px; height: 48px; border-radius: 13px; background: var(--giallo); color: var(--nero); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(245,194,0,.3); }
  .arrow-sq.dark { background: var(--nero); color: var(--giallo); box-shadow: none; }
  .tape { display: inline-block; font-family: Caveat, cursive; font-weight: 700; font-size: 22px; color: var(--nero); background: var(--giallo); padding: 2px 14px 3px; transform: rotate(-3deg); box-shadow: 0 3px 8px rgba(0,0,0,.15); white-space: nowrap; }
  .lockc { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 14px; border-radius: 999px; background: rgba(10,10,10,.72); border: 1px solid rgba(245,194,0,.55); font-family: Poppins, sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
  .lockc i { color: var(--giallo); }

  /* tasto indietro: uguale in tutte le pagine */
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 18px 0 6px; border-radius: 16px; background: rgba(10,10,10,.6); border: 1px solid rgba(255,255,255,.18); font-family: Poppins, sans-serif; font-weight: 700; font-size: 16px; color: #fff; z-index: 3; }
  .back .b { width: 40px; height: 40px; border-radius: 11px; background: var(--giallo); color: var(--nero); display: flex; align-items: center; justify-content: center; font-size: 16px; }

  /* metà sinistra e foglio a destra */
  .L { position: relative; flex-shrink: 0; display: flex; flex-direction: column; padding: 100px 32px 26px 34px; }
  .L.photo { background: #222 center/cover no-repeat; color: #fff; }
  .L.photo::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,.6) 0%, rgba(10,10,10,.05) 28%, rgba(10,10,10,.25) 48%, rgba(10,10,10,.92) 100%); }
  .L > * { position: relative; }
  .L .bottom { margin-top: auto; }
  .L .h1 { font-size: 50px; margin-top: 12px; }
  .L .lead { margin-top: 10px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 14px; border-radius: 999px; background: rgba(10,10,10,.75); border: 1px solid rgba(245,194,0,.55); font-family: Poppins, sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
  .badge i { color: var(--giallo); }
  .R { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 100px 32px 24px 28px; }
  .R.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 92px; padding-top: 8px; padding-bottom: 34px; scrollbar-width: none; }
  .R.scroll::-webkit-scrollbar { display: none; }
  .sheet { background: #fff; border-radius: 10px; padding: 22px 26px 24px; box-shadow: 0 2px 0 #eee, 0 26px 56px rgba(0,0,0,.12); }
  .hello { font-family: Caveat, cursive; font-weight: 700; font-size: 32px; color: var(--giallo-scuro); line-height: 1.1; }
  .p { font-size: 16.5px; color: var(--testo); line-height: 1.55; margin-top: 6px; }
  .p b { color: var(--nero); }
  .sep { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; }
  .sep::before, .sep::after { content: ""; flex: 1; border-top: 1px dashed #cfc6b0; }
  .sep span { font-family: Caveat, cursive; font-weight: 700; font-size: 25px; color: var(--giallo-scuro); }
  .lockline { margin-top: 14px; font-size: 14.5px; color: var(--testo-2); }
  .lockline i { color: var(--giallo-scuro); margin-right: 6px; }
  .ps { font-family: Caveat, cursive; font-weight: 700; font-size: 24px; color: var(--rosso); line-height: 1.15; margin-top: 16px; }
  .sign { font-family: Caveat, cursive; font-weight: 700; font-size: 30px; color: #333; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips span { font-size: 14px; font-weight: 600; background: var(--sabbia); border-radius: 999px; padding: 6px 12px; color: var(--nero); }
  .chips span i { color: var(--giallo-scuro); margin-right: 6px; }
  .chips.green span { background: #E3F5EA; color: #0F5E33; }
  .chips.green span i { color: #0F5E33; }
  .tools { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .tool { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; background: var(--sabbia); border-radius: 999px; padding: 7px 13px; }
  .tool i { color: var(--giallo-scuro); }
  .w-t { font-family: Poppins, sans-serif; font-weight: 900; font-size: 23px; letter-spacing: -0.035em; line-height: 1.1; }
  .w-lb { font-family: Caveat, cursive; font-weight: 700; font-size: 22px; color: var(--verde); line-height: 1; }
  .w-p { font-size: 16px; color: var(--testo); line-height: 1.55; margin-top: 6px; }
  .w-p b { color: var(--nero); }
  .num { font-family: Caveat, cursive; font-weight: 700; font-size: 38px; line-height: 1; }
  .pricelbl { display: block; font-size: 13.5px; font-weight: 600; color: var(--testo-2); margin-top: 4px; }

  /* righe numerate della lettera (schede seduta, laser, riparare, mantenimento) */
  .rows { display: flex; flex-direction: column; background: #fff; border-radius: 10px; padding: 6px 24px; box-shadow: 0 2px 0 #eee, 0 26px 56px rgba(0,0,0,.12); }
  .row { display: flex; gap: 16px; align-items: flex-start; border-bottom: 1px dashed #ddd3bd; padding: 16px 0; }
  .row:last-child { border-bottom: 0; }
  .row .num { width: 24px; padding-top: 4px; flex-shrink: 0; }
  .row .bd { flex: 1; min-width: 0; }

  /* card in stile "casi studio" */
  .card { position: relative; display: flex; flex-direction: column; background: #fff; border-radius: 20px; padding: 10px 10px 12px; border: 1px solid #ece6d8; box-shadow: 0 2px 0 #eee, 0 14px 32px rgba(0,0,0,.09); min-height: 0; }
  .card .ph { position: relative; flex: 1; min-height: 0; border-radius: 14px; background: #333 center/cover no-repeat; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .ph.ic { background: var(--sabbia); color: var(--giallo-scuro); font-size: 46px; }
  .card .ph.ic.gold { background: var(--giallo); color: var(--nero); }
  .card .ph.ic.dark { background: var(--nero); color: var(--giallo); }
  .card .ph .tape { position: absolute; left: 10px; bottom: 10px; font-size: 19px; }
  .card .tx { padding: 12px 4px 0; display: flex; align-items: flex-end; gap: 10px; }
  .card .tx > span:first-child { flex: 1; min-width: 0; }
  .card b { display: block; font-family: Poppins, sans-serif; font-weight: 900; font-size: 23px; letter-spacing: -0.035em; line-height: 1.08; }
  .card small { display: block; font-size: 14.5px; color: var(--testo-2); margin-top: 4px; line-height: 1.35; }
  .card .chips span { font-size: 12.5px; padding: 4px 9px; }
  .card .chips span.y { background: var(--giallo); }

  /* tasti di scelta in basso (sedute, famiglie, mantenimenti) */
  .switch { display: flex; gap: 8px; flex-wrap: wrap; }
  .switch button { display: flex; align-items: center; gap: 9px; min-height: 52px; padding: 0 14px 0 6px; border-radius: 14px; background: #fff; border: 1px solid #e6dfcf; font-family: Poppins, sans-serif; font-weight: 800; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,.05); }
  .switch button i.th { width: 40px; height: 40px; border-radius: 10px; background: #ddd center/cover no-repeat; display: block; }
  .switch button.on { background: var(--nero); color: #fff; border-color: var(--nero); }

  /* box nero e box crema */
  .bbox { border-radius: 18px; background: var(--nero); color: #fff; padding: 16px 18px; }
  .bbox .k { font-family: Caveat, cursive; font-weight: 700; font-size: 22px; color: var(--giallo); }
  .bbox h3 { font-family: Poppins, sans-serif; font-weight: 900; font-size: 24px; letter-spacing: -0.03em; }
  .bbox p { font-size: 15.5px; color: rgba(255,255,255,.88); line-height: 1.5; margin-top: 6px; }
  .bbox p b { color: #fff; }
  .cbox { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; padding: 13px 15px; border-radius: 16px; background: var(--crema); border: 1px solid rgba(245,194,0,.7); font-size: 15.5px; color: var(--testo); line-height: 1.5; }
  .cbox > i { width: 38px; height: 38px; border-radius: 50%; background: var(--giallo); color: var(--nero); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cbox b { color: var(--nero); }
  .cbox .t { display: block; font-family: Caveat, cursive; font-weight: 700; font-size: 21px; color: var(--giallo-scuro); line-height: 1; margin-bottom: 3px; }

  /* prezzo */
  .pbox { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 14px; padding: 14px 18px; border-radius: 16px; background: var(--nero); color: #fff; }
  .pbox .l { font-family: Caveat, cursive; font-weight: 700; font-size: 21px; color: var(--giallo); }
  .pbox .w { font-family: Poppins, sans-serif; font-weight: 800; font-size: 17px; }
  .pbox .a { font-family: Poppins, sans-serif; font-weight: 900; font-size: 32px; color: var(--giallo); white-space: nowrap; text-align: right; }
  .pbox .a small { display: block; font-family: Inter, sans-serif; font-weight: 600; font-size: 13.5px; color: rgba(255,255,255,.8); }
  .pp { font-family: Poppins, sans-serif; font-weight: 900; font-size: 22px; background: var(--giallo); padding: 3px 11px; border-radius: 9px; white-space: nowrap; }

  .addon { position: relative; display: flex; gap: 12px; align-items: center; margin-top: 14px; padding: 13px; border-radius: 16px; border: 1.5px dashed #bfb59c; }
  .addon .bdg { position: absolute; top: -10px; left: 12px; font-family: Poppins, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: .08em; background: #fff; padding: 0 6px; color: var(--testo-2); }
  .addon img { width: 62px; height: 76px; object-fit: contain; flex-shrink: 0; }
  .addon b { display: block; font-family: Poppins, sans-serif; font-weight: 800; font-size: 16.5px; }
  .addon small { font-size: 14.5px; color: var(--testo-2); line-height: 1.4; }
  .addon .ap { margin-left: auto; font-family: Poppins, sans-serif; font-weight: 900; font-size: 20px; white-space: nowrap; }

  /* ===================== HOME ===================== */
  .home-L { width: 44%; }
  .home-L .h1 { font-size: 52px; margin-top: 14px; }
  .home-L .lead { max-width: 380px; }
  .home-L .dani { position: absolute; left: -70px; right: 90px; bottom: 0; height: 52%; background: var(--daniela) center bottom/contain no-repeat; }
  .home-L .note { position: absolute; right: 30px; bottom: 214px; text-align: right; color: var(--giallo); font-size: 27px; transform: rotate(-6deg); line-height: 1.05; }
  .stats { position: absolute; right: 26px; bottom: 26px; display: flex; flex-direction: column; gap: 10px; }
  .stats div { background: rgba(21,21,21,.94); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 12px 16px; min-width: 160px; }
  .stats b { display: block; font-family: Poppins, sans-serif; font-weight: 900; font-size: 32px; letter-spacing: -0.03em; color: var(--giallo); line-height: 1; }
  .stats small { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.88); }
  .home-g { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; gap: 16px; margin-top: 14px; }
  .home-g .card b { font-size: 32px; }
  .wid { display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 12px; border-radius: 20px; background: #fff; border: 1px solid #ece6d8; box-shadow: 0 2px 0 #eee, 0 14px 32px rgba(0,0,0,.09); }
  .wid .sq { width: 66px; height: 66px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: Caveat, cursive; font-weight: 700; font-size: 50px; flex-shrink: 0; }
  .wid b { display: block; font-family: Poppins, sans-serif; font-weight: 900; font-size: 23px; white-space: nowrap; letter-spacing: -0.035em; line-height: 1.05; }
  .wid small { font-size: 14.5px; color: var(--testo-2); }
  .wid .arrow-sq { margin-left: auto; }

  /* ===================== PERCORSI ===================== */
  .pc-L { width: 40%; }
  .pc-L .h1 { font-size: 46px; }
  .how { margin-top: 16px; background: var(--nero-2); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 16px 16px 14px; }
  .how .t { font-family: Caveat, cursive; font-weight: 700; font-size: 28px; color: var(--giallo); line-height: 1; }
  .how p { font-size: 15.5px; color: rgba(255,255,255,.88); margin-top: 6px; line-height: 1.5; }
  .how p b { color: #fff; }
  .ex { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .ex span { flex: 1; text-align: center; background: rgba(255,255,255,.1); border-radius: 10px; padding: 9px 6px; }
  .ex i { color: var(--giallo); font-size: 12px; }
  .inc-k { font-family: Caveat, cursive; font-weight: 700; font-size: 23px; color: var(--giallo); margin-top: 12px; line-height: 1; }
  .inc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .inc div { background: rgba(255,255,255,.08); border-radius: 12px; padding: 9px 6px; text-align: center; }
  .inc i { color: var(--giallo); font-size: 17px; }
  .inc i.fa-whatsapp { color: #25D366; }
  .inc b { display: block; font-family: Poppins, sans-serif; font-weight: 800; font-size: 13.5px; margin-top: 4px; }
  .inc small { display: block; font-size: 12.5px; color: rgba(255,255,255,.78); }
  .psl { margin-top: auto; padding-top: 12px; font-family: Caveat, cursive; font-weight: 700; font-size: 24px; color: #fff; line-height: 1.1; }
  .psl b { color: var(--giallo); font-size: 28px; margin-right: 6px; }
  .sgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 10px; }
  .sgrid .card b { font-size: 21px; }
  .sgrid .card small { font-size: 13.5px; }
  .sgrid .card .arrow-sq { width: 44px; height: 44px; }
  .card.dark { background: var(--nero); border-color: var(--nero); color: #fff; }
  .card.dark small { color: rgba(255,255,255,.8); }
  .mstrip { margin-top: 14px; display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 18px; background: var(--nero); color: #fff; border-radius: 18px; }
  .mstrip .k { font-family: Caveat, cursive; font-weight: 700; font-size: 22px; color: var(--giallo); line-height: 1; }
  .mstrip b { display: block; font-family: Poppins, sans-serif; font-weight: 800; font-size: 19px; }
  .mstrip .btns { display: flex; gap: 8px; margin-left: auto; }
  .mstrip .btns button { min-height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-radius: 12px; background: rgba(255,255,255,.12); font-family: Poppins, sans-serif; font-weight: 800; font-size: 16px; color: #fff; }
  .mstrip .btns i { color: var(--giallo); font-size: 14px; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; }
  .sec h2 { font-family: Poppins, sans-serif; font-weight: 900; font-size: 27px; letter-spacing: -0.04em; }
  .sec .hand { font-size: 24px; color: var(--giallo-scuro); }

let menuTab = 'donna';

function go(page, p = {}, push = true) {
  if (push) S.hist.push({ page: S.page, p: S.p });
  S.page = page; S.p = p;
  if (page === 'donna') { menuTab = 'donna'; S.g = 'lei'; }
  if (page === 'uomo') { menuTab = 'uomo'; S.g = 'lui'; }
  render(true);
  if (window.gtag) gtag('event', 'ipad_page', { page_name: page });
}
function back() {
  const prev = S.hist.pop();
  if (prev) { S.page = prev.page; S.p = prev.p; if (S.page === 'donna') S.g = 'lei'; if (S.page === 'uomo') S.g = 'lui'; render(true); }
  else go('home', {}, false);
}
function tab(t) { S.hist = []; go(t, {}, false); }
function currentTab() { return TAB_OF[S.page] || menuTab; }
const backLabel = () => { const prev = S.hist[S.hist.length - 1]; return prev ? NAMES[prev.page] || 'Indietro' : 'Home'; };

/* ============================================================
   RENDER E INTERAZIONI
   ============================================================ */
const app = document.getElementById('app');
function render(scrollTop) {
  const prevScroll = !scrollTop && app.querySelector('.R.scroll') ? app.querySelector('.R.scroll').scrollTop : 0;
  app.innerHTML = `<section class="scr ${['seduta', 'mant'].includes(S.page) && !(S.page === 'mant' && (S.p.ans || []).length < 3) ? 'bg-white' : ''}">${P[S.page]()}</section>${nav()}`;
  const sc = app.querySelector('.R.scroll'); if (sc && prevScroll) sc.scrollTop = prevScroll;
}
app.addEventListener('click', e => {
  const t = e.target;
  const tb = t.closest('[data-tab]'); if (tb) return tab(tb.dataset.tab);
  const gb = t.closest('[data-g]'); if (gb) { S.g = gb.dataset.g; return render(false); }
  if (t.closest('[data-back]')) return back();
  const sed = t.closest('[data-sed]'); if (sed) { const c = SED_CARDS[+sed.dataset.i]; return go(c.go[0], c.go[1]); }
  const gl = t.closest('[data-go]');
  if (gl) {
    const arg = gl.dataset.arg ? JSON.parse(gl.dataset.arg) : {};
    if (gl.hasAttribute('data-replace')) { S.p = arg; S.page = gl.dataset.go; return render(true); }
    return go(gl.dataset.go, arg);
  }
  const q = t.closest('[data-q]');
  if (q) { const i = +q.dataset.q, ans = (S.p.ans || []).slice(0, i); ans[i] = +q.dataset.n; q.classList.add('sel'); setTimeout(() => { S.p = { ...S.p, ans }; render(true); }, 260); return; }
  if (t.closest('[data-video]')) { S.p = { ...S.p, video: true }; return render(false); }
  if (t.closest('[data-closevideo]')) { S.p = { ...S.p, video: false }; return render(false); }
  if (t.closest('[data-closeprize]')) { S.p = { ...S.p, prize: null }; return render(false); }
  const sp = t.closest('[data-spin]');
  if (sp && !spinning) {
    spinning = true;
    const i = Math.floor(Math.random() * PRIZES.length), seg = 60;
    wheelRot = wheelRot + (5 + Math.floor(Math.random() * 4)) * 360 + (360 - (i * seg + seg / 2)) - (wheelRot % 360);
    const svg = app.querySelector('.wheelbox svg');
    svg.style.transition = 'transform 5s cubic-bezier(0.17,0.67,0.12,0.99)';
    requestAnimationFrame(() => { svg.style.transform = `rotate(${wheelRot}deg)`; });
    sp.disabled = true; sp.textContent = 'Sta girando…';
    setTimeout(() => { spinning = false; S.p = { ...S.p, prize: PRIZES[i] }; render(false); }, 5200);
  }
});

/* la tela 1180×820 si adatta allo schermo dell'iPad */
function fit() {
  const s = Math.min(window.innerWidth / 1180, window.innerHeight / 820);
  app.style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));
fit(); render(true);
</script>
