/* === iPHONE E SMARTPHONE (Clienti) === */

            if (section === 'forma' && gender === 'donna') {

        const shouldShowBackButton = gender !== null;

        return html`
           <div className="w-full relative">
              ${shouldShowBackButton && html`<${FixedBackButton} onClick=${handleBack} />`}
              ${renderView()}
           </div>
        `;
      };

      const App = () => {
        const [activeTab, setActiveTab] = useState('home');
        const [isOpen, setIsOpen] = useState(false);
        const mainRef = useRef(null);

        // Funzione globale per scrollare in cima — accessibile dai figli
        const scrollToTop = useCallback(() => {
          if (mainRef.current) {
            mainRef.current.scrollTo({ top: 0, behavior: 'instant' });
          }
        }, []);

        // Scroll in cima quando cambia tab
        useEffect(() => {
          scrollToTop();
        }, [activeTab]);

        // GA4: section_view per le tab gestite da App (Home è già tracciata dentro DigitalMenu)
        useEffect(() => {
          if (typeof gtag !== 'function') return;
          if (activeTab === 'home') return;

          gtag('event', 'section_view', {
            section_type: activeTab,
            section_id: activeTab,
            gender: null,
            device_form_factor: getDeviceFormFactor()
          });

          sectionScrollState.sectionId = activeTab;
          sectionScrollState.seen90 = false;
        }, [activeTab]);

        // GA4: section_scroll — soglia unica al 90% (semplificazione concordata), solo su smartphone
        useEffect(() => {
          const el = mainRef.current;
          if (!el || typeof gtag !== 'function') return;
          if (getDeviceFormFactor() !== 'phone') return;

          let ticking = false;
          const handleScroll = () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
              ticking = false;
              const scrollable = el.scrollHeight - el.clientHeight;
              if (scrollable <= 0 || sectionScrollState.seen90) return;
              const percent = (el.scrollTop / scrollable) * 100;
              if (percent >= 90) {
                sectionScrollState.seen90 = true;
                gtag('event', 'section_scroll', {
                  section_id: sectionScrollState.sectionId,
                  depth_percent: 90,
                  device_form_factor: getDeviceFormFactor()
                });
              }
            });
          };

          el.addEventListener('scroll', handleScroll, { passive: true });
          return () => el.removeEventListener('scroll', handleScroll);
        }, []);

        return html`
          <div className="flex flex-col overflow-hidden relative" style=${{ height: 'var(--app-height, 100vh)' }}>
            <button id="hamburger-btn" onClick=${() => setIsOpen(true)} className="fixed top-4 left-4 sm:top-8 sm:left-8 z-40 w-16 h-16 sm:w-14 sm:h-14 bg-white rounded-full shadow-lg flex items-center justify-center text-black border border-white active:scale-95 transition-transform">
              <i className="fa-solid fa-bars-staggered text-xl"></i>
            </button>

            ${activeTab !== 'home' && html`
                <${FixedBackButton} onClick=${() => setActiveTab('home')} />
            `}

            ${isOpen && html`<div className="fixed inset-0 bg-black/20 backdrop-blur-sm z-40" onClick=${() => setIsOpen(false)} />`}
            <div className=${`fixed top-0 left-0 h-full z-50 transition-transform duration-500 ease-in-out ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}>
              <${Sidebar} activeTab=${activeTab} setActiveTab=${setActiveTab} onClose=${() => setIsOpen(false)} />
            </div>
            <main ref=${mainRef} className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6">
              <div className="max-w-[1200px] mx-auto pt-16 sm:pt-20 pb-8">
                ${activeTab === 'home' ? html`<${DigitalMenu} scrollToTop=${scrollToTop} />` :
                  activeTab === 'baby-check' ? html`<${BabyCheckList} />` :
                  activeTab === 'regala-beautri' ? html`<${RegalaBeautriList} />` :
                  html`
                  <div className="flex flex-col items-center justify-center animate-zoom-in py-20">
                    <div className="bg-white rounded-[1.5rem] sm:rounded-[2rem] md:rounded-[3rem] p-12 shadow-sm w-full max-w-2xl text-center uppercase tracking-widest">
                      <i className="fa-solid fa-note-sticky text-4xl text-[#EAB308] mb-6"></i>
                      <h2 className="text-2xl font-black mb-4 tracking-tighter">NOTE</h2>
                      <p className="text-slate-400 text-sm font-bold normal-case">Le tue note vengono salvate automaticamente nella barra laterale</p>
                    </div>
                  </div>
                `}
              </div>
            </main>
          </div>
        `;
      };

      const rootElement = document.getElementById('root');
      const root = createRoot(rootElement);
      root.render(html`<${App} />`);
    </script>
</body>
